<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Limassol Office Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@500&display=swap">
<style>
html,body{margin:0}body{-webkit-text-size-adjust:100%}*{box-sizing:border-box}
/* Layout: brand header, then map and numbered list side by side (stacked on phones). One deliberate light look. */
:root{
  --navy:#0b1728; --gold:#b48a65; --gold-dark:#8a6a4c; --soft:#4a5363; --line:#e3d6c8;
  --paper:#ffffff; --mist:#f6f3ef;
  --serif:'Cormorant Garamond', Georgia, serif; --sans:'Montserrat', Arial, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--navy);font-family:var(--serif);font-size:17px;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.shell{display:flex;flex-direction:column;min-height:100%}
header{display:flex;align-items:center;gap:16px;padding-block:14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--gold)}
header img{width:40px;height:43px;flex:none}
header .t{display:flex;flex-direction:column;min-width:0}
header h1{margin:0;font-size:24px;font-weight:500;line-height:1.15;text-wrap:balance}
header p{margin:0;font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dark)}
main{flex:1;display:flex;flex-wrap:wrap;min-height:0}
#map{flex:999 1 560px;min-width:0;min-height:62vh;background:#b9cbd2}
aside{flex:1 1 320px;max-width:100%;min-width:0;border-left:1px solid var(--line);background:var(--mist);overflow:auto;max-height:calc(100vh - 72px)}
@media (max-width:900px){aside{border-left:0;border-top:1px solid var(--line);max-height:none}}
.list{list-style:none;margin:0;padding:8px 0}
.list li{border-bottom:1px solid var(--line)}
.list button{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));cursor:pointer;min-height:44px}
.list button:hover,.list button[aria-current="true"]{background:#fff}
.list button:focus-visible{outline:2px solid var(--gold-dark);outline-offset:-2px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--sans);font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.li-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.li-t b{font-size:19px;font-weight:600;line-height:1.2}
.li-t span{font-size:15px;color:var(--soft);line-height:1.3}
.foot{padding:16px max(16px, env(safe-area-inset-left, 0px));font-size:14px;color:var(--soft);line-height:1.5}
.foot b{color:var(--navy);font-size:17px;font-weight:600}
.attr{font-family:var(--sans);font-size:10px;color:var(--soft)}
/* pins */
.pin{width:34px;height:34px;border-radius:50%;background:var(--navy);border:2px solid var(--gold);color:#fff;font-family:var(--sans);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(11,23,40,.35);transition:transform .15s}
.pin.on{background:var(--gold);border-color:var(--navy);color:var(--navy);transform:scale(1.15)}
/* popup */
.pop{display:flex;flex-direction:column;gap:8px;width:230px;font-family:var(--serif);color:var(--navy)}
.pop img{width:100%;height:110px;object-fit:cover;object-position:50% 72%;display:block;border:1px solid var(--line)}
.pop h3{margin:0;font-size:20px;font-weight:600;line-height:1.15}
.pop .a{font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dark)}
.pop .p{font-size:15px;line-height:1.35}
.pop .btns{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pop a.btn{display:flex;align-items:center;justify-content:center;min-height:40px;background:var(--navy);color:#fff;text-decoration:none;font-family:var(--sans);font-size:12px;letter-spacing:.06em}
.pop a.btn:hover{background:#1c2b44}
.pop a.lnk{text-align:center;color:var(--gold-dark);font-size:15px}
/* minimal Leaflet styles */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--serif);outline:0}
.leaflet-container img.leaflet-image-layer{max-width:none!important;max-height:none!important}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path{user-select:none;-webkit-user-select:none}
.leaflet-container .leaflet-marker-pane img{max-width:none!important}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane{z-index:100}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon{display:block;cursor:pointer}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-control-container .leaflet-top,.leaflet-control-container .leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{background:#fff;border:1px solid var(--gold)}
.leaflet-bar a{display:block;width:40px;height:40px;line-height:40px;text-align:center;text-decoration:none;color:var(--navy);font:600 20px/40px var(--sans);border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-control-attribution{background:rgba(255,255,255,.85);padding:2px 6px;font:10px var(--sans);color:var(--soft)}
.leaflet-control-attribution a{color:var(--soft)}
.leaflet-popup{position:absolute;text-align:left;margin-bottom:20px}
.leaflet-popup-content-wrapper{background:#fff;border:1px solid var(--gold);box-shadow:0 6px 20px rgba(11,23,40,.25);padding:1px}
.leaflet-popup-content{margin:12px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:14px;height:14px;padding:1px;margin:-8px auto 0;transform:rotate(45deg);background:#fff;border:1px solid var(--gold)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:32px;height:32px;font:22px/32px var(--sans);color:var(--soft);text-decoration:none;text-align:center}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-div-icon{background:none;border:0}
/* PDF viewer */
.viewer{position:fixed;inset:0;z-index:5000;background:rgba(11,23,40,.92);display:flex;flex-direction:column}
.viewer[hidden]{display:none!important}
.vbar{display:flex;align-items:center;gap:12px;padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));padding-top:max(10px, env(safe-area-inset-top, 0px));background:var(--navy);color:#fff;border-bottom:1px solid var(--gold)}
.vbar b{flex:1;min-width:0;font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{all:unset;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:#fff;border:1px solid var(--gold);padding:0 14px}
.vbar button:focus-visible{outline:2px solid #fff}
.vpages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-overflow-scrolling:touch}
.vpages canvas{width:min(100%,820px);height:auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.vnote{color:#fff;font-family:var(--sans);font-size:12px;text-align:center;min-height:0}
.vnote:not(:empty){padding:8px 16px;background:#1c2b44}
.pop a.btn.dl{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.pop a.btn.dl:hover{background:var(--mist)}
.pop a.btn.dl[hidden]{display:none}
.vmsg{color:#fff;font-size:17px;padding:24px;text-align:center}
@media (prefers-reduced-motion:reduce){.pin,.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}
.toast{position:fixed;left:50%;bottom:max(18px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:4000;background:#0b1728;color:#fff;border:1px solid #b48a65;padding:12px 18px;font-family:var(--sans);font-size:12px;letter-spacing:.04em;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(11,23,40,.3)}
.toast[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">
  <header>
    <img src="logo.svg" alt="United Properties">
    <div class="t">
      <p>United Properties</p>
      <h1>Office options in Limassol</h1>
    </div>
  </header>
  <main>
    <div id="map" role="region" aria-label="Map of Limassol with the office options"></div>
    <aside>
      <ol class="list" id="list"></ol>
      <div class="foot">
        <b>Panos Michail</b><br>
        Founder &amp; Managing Director<br>
        +357 96178188<br>
        michail@unitedproperties.eu<br>
        <span style="font-size:12px">Reg. No. 1393 · Lic. No. 703/E</span>
        <p class="attr" style="margin:10px 0 0">Map data © OpenStreetMap contributors. Pin locations and areas are indicative.</p>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
  var W=2560,H=2304, POLL=120000;
  var list=document.getElementById('list'), toast=document.getElementById('toast');
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
  function show(msg){toast.textContent=msg;toast.hidden=false;clearTimeout(show.t);show.t=setTimeout(function(){toast.hidden=true},8000)}

  var hasMap=!!window.L, map=null, active=null, items={}, firstLoad=true, lastSig='';
  if(hasMap){
    map=L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:1,zoomSnap:0.25,maxBoundsViscosity:0.8});
    L.imageOverlay('limassol.jpg',[[-H,0],[0,W]]).addTo(map);
    map.attributionControl.setPrefix(false).addAttribution('© OpenStreetMap contributors');
    map.setMaxBounds([[-H-200,-200],[200,W+200]]);
    map.fitBounds([[-H*0.85,W*0.15],[-H*0.12,W*0.8]]);
    window.addEventListener('resize',function(){map.invalidateSize()});
  } else {
    document.getElementById('map').innerHTML='<p style="padding:16px">The map could not load. Use the list to open each option.</p>';
  }

  function popup(p){
    return '<div class="pop"><img src="'+esc(p.thumb)+'" alt=""><span class="a">Option '+p.n+' · '+esc(p.area)+'</span><h3>'+esc(p.name)+'</h3><span class="p">'+esc(p.price)+'</span><div class="btns"><a class="btn" href="'+esc(p.pdf)+'" target="_blank" rel="noopener">Open the PDF</a><a class="btn dl" href="'+esc(p.pdf)+'" download="'+esc(p.file||p.name)+' - United Properties.pdf">Download the PDF</a><a class="lnk" href="https://www.google.com/maps?q='+esc(p.lat)+','+esc(p.lng)+'" target="_blank" rel="noopener">Directions in Google Maps</a></div></div>';
  }
  function setActive(n){
    active=n;
    Object.keys(items).forEach(function(k){var it=items[k];var el=document.getElementById('pin-'+k);if(el)el.classList.toggle('on',+k===n);it.btn.setAttribute('aria-current',+k===n?'true':'false')});
  }
  function render(opts){
    var seen={};
    opts.sort(function(a,b){return a.n-b.n});
    list.innerHTML='';
    opts.forEach(function(p){
      seen[p.n]=1;
      var li=document.createElement('li');
      li.innerHTML='<button type="button"><span class="num">'+p.n+'</span><span class="li-t"><b>'+esc(p.name)+'</b><span>'+esc(p.area)+'</span><span>'+esc(p.price)+'</span></span></button>';
      list.appendChild(li);
      var btn=li.firstChild, it=items[p.n];
      if(hasMap){
        var ll=[-p.y,p.x];
        if(!it){
          var icon=L.divIcon({className:'',html:'<div class="pin" id="pin-'+p.n+'">'+p.n+'</div>',iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-14]});
          var m=L.marker(ll,{icon:icon,title:p.n+'. '+p.name,riseOnHover:true}).addTo(map);
          m.on('popupopen',function(){setActive(p.n)}); m.on('popupclose',function(){if(active===p.n)setActive(null)});
          it=items[p.n]={m:m};
        } else { it.m.setLatLng(ll); }
        it.m.bindPopup(popup(p),{maxWidth:260,keepInView:true,autoPanPaddingTopLeft:[20,30],autoPanPaddingBottomRight:[20,20]});
        btn.addEventListener('click',function(){
          map.flyTo(ll,0,{duration:.6}); setTimeout(function(){items[p.n]&&items[p.n].m.openPopup()},650);
          if(window.innerWidth<=900)document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
        });
      } else {
        it=items[p.n]=items[p.n]||{};
        btn.addEventListener('click',function(){window.open(p.pdf,'_blank')});
      }
      it.btn=btn; it.p=p;
    });
    Object.keys(items).forEach(function(k){ if(!seen[k]){ if(items[k].m)map.removeLayer(items[k].m); delete items[k]; } });
    if(active!=null && items[active]) setActive(active);
  }
  function load(){
    return fetch('options.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(txt){
      if(txt===lastSig)return;
      var data=JSON.parse(txt), opts=data.options||[];
      var before=Object.keys(items).map(Number);
      render(opts);
      if(!firstLoad){
        var added=opts.filter(function(p){return before.indexOf(p.n)<0});
        if(added.length) show('New option added: '+added.map(function(p){return p.n+'. '+p.name}).join(', '));
        else show('The list of options has been updated.');
      }
      firstLoad=false; lastSig=txt;
    }).catch(function(){ if(firstLoad) list.innerHTML='<li class="foot">The options could not load. Please refresh the page.</li>'; });
  }
  load();
  setInterval(function(){ if(!document.hidden) load(); }, POLL);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) load(); });
})();
</script>
</body>
</html>
